name: bytepcmarketplace
description: A cross-platform PC components marketplace

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.1.0
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3

  # Navigation
  go_router: ^17.1.0

  # State Management
  provider: ^6.1.2

  # UI Utilities
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  google_fonts: ^6.1.0

  # Utilities
  uuid: ^4.4.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
